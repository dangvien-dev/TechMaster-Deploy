name: Cập nhật chỉ mục (Build-UpdateIndex)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-index:
    runs-on: windows-latest
    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Chạy script Build-UpdateIndex.ps1
        shell: pwsh
        run: |
          ./App/Build-UpdateIndex.ps1

      - name: Commit và đẩy lại lên GitHub
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update-source.json update-package.json
          if (git diff --staged --quiet) {
            Write-Host "Chỉ mục đã khớp, không có thay đổi mới."
          } else {
            git commit -m "chore: cập nhật chỉ mục qua GitHub Actions"
            git push
          }
