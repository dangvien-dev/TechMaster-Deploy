name: Windows WPF validation
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wpf:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Native WPF layout and wiring
        shell: powershell
        run: |
          try {
            & App/Test-InfoEntryPoints.ps1
            & App/Test-Wpf.ps1
            & App/Test-DefaultsWpf.ps1
            & App/Test-LanAccountsWpf.ps1
            & App/Test-UpdateProbe.ps1
            & App/Test-LogoPreview.ps1
            & FixClone/Test-DriverFixWpf.ps1
          }
          catch {
            $detail = ($_.Exception.ToString() + "`n" + $_.ScriptStackTrace)
            $detail | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $escaped = $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
            Write-Output "::error title=Native WPF validation::$escaped"
            exit 1
          }
      - name: Update transactions and worker runspaces
        shell: powershell
        run: |
          try {
          & App/Test-Update.ps1
          & App/Test-RepoUpdate.ps1
          & App/Test-PublicUpdate.ps1
          & App/Test-UpdateHandshake.ps1
          & App/Test-WpfRuntime.ps1
          & App/Test-DeployActions.ps1
          & App/Test-UltraInstall.ps1
          & App/Test-WinRARStartup.ps1
          & App/Test-PdfPrinter.ps1
          & App/Test-WindowsTools.ps1
          & App/Test-Defaults.ps1
          & App/Test-LanAccounts.ps1
          & App/Test-Info.ps1
          & App/Test-AvDiagnostics.ps1
          & App/Test-AvRepair.ps1
          & App/Test-CustomApps.ps1
          & App/Test-UpdateNotification.ps1
          & FixClone/Test-UltraViewerDiagnostics.ps1
          & FixClone/Test-MasterPreflight.ps1
          & FixClone/Test-UltraViewerLifecycle.ps1
          & FixClone/Test-MasterDeployment.ps1
          & FixClone/Test-WindowsLicense.ps1
          & FixClone/Test-DriverFix.ps1
          & FixClone/Test-DriverFixInventory.ps1
          & FixClone/Test-WordSettings.ps1
          & FixClone/Test-DinhDang.ps1
          & FixClone/Test-BanPhim.ps1
          & FixClone/Test-Unattend.ps1
          & Office/Test-OfficeCleanup.ps1
          & Office/Test-OfficeTemporary.ps1
          & BienBan/Test-Report.ps1
          & BienBan/Test-LicenseConfirmation.ps1
          & KichHoat/Test-Activation.ps1
          & KichHoat/Test-QrLifecycle.ps1
          & KichHoat/Test-QrWindow.ps1
          & KichHoat/Test-CidPhone.ps1
          & App/Test-UpdateEngine.ps1
          & App/Test-StartupWait.ps1
          & App/Build-UpdateIndex.ps1 -Check
          } catch {
            $detail = ($_.Exception.ToString() + "`n" + $_.ScriptStackTrace)
            $detail | Out-File $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Write-Output ("::error title=Update tests::" + $detail.Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A'))
            exit 1
          }
      - name: Build Windows applications
        shell: powershell
        run: |
          $version = (Get-Content version.txt -Raw).Trim()
          & App/Build-Launcher.ps1
          & App/Build-UpgradeHelper.ps1 -OutputDirectory artifacts
          & App/Build-Release.ps1 -Version $version -OutputDirectory artifacts
      - uses: actions/upload-artifact@v4
        with:
          name: TechMaster-Deploy-WPF
          path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.sha256
